name: CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions. `security-events: write` is required so the CodeQL
# SARIF upload action can publish Trivy results to code scanning.
permissions:
  contents: read
  security-events: write

jobs:
  # ---------- Backend: lint, format, typecheck, tests ----------
  backend:
    name: Backend (lint/type/test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type check
        run: mypy

      - name: Pytest (coverage)
        run: pytest --cov=paymentops_api --cov=payment_domain --cov=paymentops_worker --cov-report=term-missing -q

  # ---------- Frontend: lint, typecheck, build ----------
  frontend:
    name: Frontend (lint/type/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # ---------- Security: secret + dependency scanning prep ----------
  security:
    name: Security (secret/dep scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan (detect leaked secrets)
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --results=verified,unknown

      - name: Run Trivy filesystem vulnerability scan (prep)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'   # advisory-only in Week 1; switch to '1' to block later
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: Trivy

  # ---------- Build & publish images to GHCR (private, immutable SHA tags) ----------
  build:
    name: Build & publish images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/cloodnova/paymentops-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/cloodnova/paymentops-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/cloodnova/paymentops-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push address-structuring image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/address-structuring/Dockerfile
          push: true
          tags: ghcr.io/cloodnova/paymentops-address-structuring:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOMs for published images
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/cloodnova/paymentops-api:${{ github.sha }}
          format: spdx-json
          output-file: sbom-api.syft.json

      - name: Generate SBOM for web image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/cloodnova/paymentops-web:${{ github.sha }}
          format: spdx-json
          output-file: sbom-web.syft.json

      - name: Generate SBOM for worker image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/cloodnova/paymentops-worker:${{ github.sha }}
          format: spdx-json
          output-file: sbom-worker.syft.json

      - name: Generate SBOM for address-structuring image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/cloodnova/paymentops-address-structuring:${{ github.sha }}
          format: spdx-json
          output-file: sbom-address.syft.json
